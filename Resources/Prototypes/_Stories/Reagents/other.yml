        effectProto: StatusEffectWoozy
        probability: 0.1
        time: 4
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
        - !type:Emote
          emote: Scream
          showInChat: true
          probability: 0.1
        - !type:Emote
          emote: Crying
          showInChat: true
          probability: 0.5
        - !type:ModifyStatusEffect
          effectProto: StatusEffectWoozy
          time: 20
          type: Set
        - !type:ModifyKnockdown
          time: 0.5
        - !type:MovementSpeedModifier
          walkSpeedModifier: 0.7
          sprintSpeedModifier: 0.7
          time: 5
        - !type:Jitter
