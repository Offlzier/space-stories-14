  desc: Химическое вещество, используемое для самообороны и в работе полиции.
  physicalDesc: reagent-physical-desc-pungent
  flavor: stincineratingagony
  group: Other
  color: "#B31008"
  metabolisms:
    Bloodstream:
      effects:
      - !type:PopupMessage
        type: Local
        visualType: MediumCaution
        messages: [ "У вас сильно болит голова." ]
        probability: 0.15
      - !type:Vomit
        probability: 0.05
