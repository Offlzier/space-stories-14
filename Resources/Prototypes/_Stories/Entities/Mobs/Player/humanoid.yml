# Centcom-Jobs

- type: entity
  id: STRandomHumanoidSpawnerChiefCentcom
  name: Chief of Staff of the Central Command
  suffix: CSCC
  components:
    - type: Sprite
      sprite: _Stories/Markers/jobs.rsi
      state: chief_centcom
    - type: RandomHumanoidSpawner
      settings: STChiefCentcom

- type: randomHumanoidSettings
  id: STChiefCentcom
  parent: EventHumanoidMindShielded
  components:
    - type: AutoImplant
      implants:
      - MindShieldImplant
      - DeathRattleImplantCentcomm
      - STRadioImplantDSO
      - RadioImplantCentcomm
    - type: GhostRole
      name: stories-job-name-chief-centcom
      description: stories-job-description-chief-centcom
      rules: ghost-role-information-nonantagonist-rules
      raffle:
        settings: short
      job: STChiefCentcom
      requirements:
        - !type:RoleTimeRequirement
          role: JobSTOperatorCentcom
          time: 10h
        - !type:RoleTimeRequirement
          role: JobSTRepresentativeCentcom
          time: 10h
        - !type:RoleTimeRequirement
          role: JobSTHeadOfSecurityCentcom
          time: 10h
    - type: Loadout
      prototypes: [ STChiefCentcomGear ]
    - type: RandomMetadata
      nameSegments:
      - NamesFirst
      - NamesLast
      nameFormat: name-format-standard

