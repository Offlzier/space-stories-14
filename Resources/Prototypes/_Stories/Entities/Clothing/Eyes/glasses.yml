- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesThermalVisionBase
  abstract: true
  components:
  - type: VisionProvider
    thermalVision: true
    thermalShader: ThermalVision
    thermalAmbientColor: "#FF8888"
    toggleAction: STActionToggleThermal

- type: entity
  parent: ClothingEyesThermalVisionBase
  id: ClothingEyesThermalVisionMonocular
  name: thermal vision monocle
  description: The latest scouting technology placed inside a monocle. Allows seeing organic targets in complete darkness and even through walls.
  components:
  - type: Sprite
    sprite: _Stories/Clothing/Eyes/Glasses/termalhud_oneglass.rsi
  - type: Clothing
    sprite: _Stories/Clothing/Eyes/Glasses/termalhud_oneglass.rsi

- type: entity
  parent: [ClothingEyesThermalVisionBase, ClothingEyesHudSyndicate]
  id: ClothingEyesThermalVisionHud
  name: operative's thermal visor
  description: The latest scouting technology placed inside a visor. Allows seeing organic targets in complete darkness and even through walls. This variant, specifically for Nuclear Operatives, has a built-in Syndicate visor.
  components:
  - type: Sprite
    sprite: _Stories/Clothing/Eyes/Glasses/termalhud.rsi
  - type: Clothing
    sprite: _Stories/Clothing/Eyes/Glasses/termalhud.rsi

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesNightvision
  name: night vision goggles
  description: Allows seeing in complete darkness. Powered by an internal nuclear battery and not at all harmful to the eyes.
  components:
  - type: VisionProvider
    shader: Nightvision
    ambientColor: "#55ff5510"
    toggleAction: STActionToggleVision
  - type: Sprite
    sprite: _Stories/Clothing/Eyes/Glasses/nvg.rsi
  - type: Clothing
    sprite: _Stories/Clothing/Eyes/Glasses/nvg.rsi

- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, ShowMedicalIcons, BaseCentcommContraband]
  id: STClothingEyesGlassesCentcom
  name: Centcom glasses
  description: Upgraded sunglasses with flash protection function, equipped with a medical and security visor.
  components:
  - type: Sprite
    sprite: _Stories/Clothing/Eyes/Glasses/centcomm_glasses.rsi
  - type: Clothing
    sprite: _Stories/Clothing/Eyes/Glasses/centcomm_glasses.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: Construction
    graph: GlassesSecHUD
    node: glassesSec
  - type: Tag
    tags:
    - HamsterWearable
    - HudMedical
    - PetWearable
    - WhitelistChameleon
  - type: GuideHelp
    guides:
    - Security
    - Antagonists
  - type: IdentityBlocker
    coverage: EYES
