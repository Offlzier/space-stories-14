- type: entity
  name: blue shield laser pistol
  parent: BaseWeaponBatterySmall
  id: STWeaponEnergyPistolBlueShield
  description: A pistol designed specifically for officers whose tasks include protecting members of the command stuff.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Battery/blueshield_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Battery/blueshield_gun.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 1.5
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Battery
    maxCharge: 750
    startingCharge: 750
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisabler
      fireCost: 50
    - proto: BulletTaser
      fireCost: 75
    - proto: BulletLaser
      fireCost: 75
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 50
