- type: entity
  parent: BaseItem
  id: STBaseExtractXenoSlime
  name: экстракт слизи
  description: Слизь, извлеченная из какого-то вещества. По легендам, она обладает «магическими свойствами».
  abstract: true
  components:
  - type: Sprite
    sprite: _Stories/Objects/Misc/xeno_biology/extract.rsi
    state: grey
  - type: Extractable
    grindableSolutionName: solution
  - type: Solution
    solution:
      reagents:
        - ReagentId: STSlimeJelly
          Quantity: 20

- type: entity
  parent: STBaseExtractXenoSlime
  id: STGreyExtractXenoSlime
  name: серый экстракт слизи
  components:
  - type: Sprite
    state: grey
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: STGreySlimeExtract
        Quantity: 3

